services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:3000 # the vite proxy reaches the backend by its service name
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
